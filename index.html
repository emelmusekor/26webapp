<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>디지터시 컴퓨터</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css?v=20260603-os5" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <img src="assets/digiteracy-mascot.svg" alt="" class="brand-mascot" />
          <div>
            <p class="eyebrow">디지터시 컴퓨터</p>
            <h1>체험 플랫폼</h1>
          </div>
        </div>
        <div class="top-status" aria-label="학습 상태">
          <div>
            <span class="status-label">현재 경로</span>
            <strong id="currentPathLabel">컴퓨터 · 바탕화면</strong>
          </div>
          <div>
            <span class="status-label">획득 배지</span>
            <strong id="badgeCountLabel">0개</strong>
          </div>
        </div>
      </header>

      <div class="workspace">
        <nav class="dock" aria-label="주요 메뉴">
          <button class="dock-button active" data-view="computer" type="button" aria-label="가상 컴퓨터">
            <span class="dock-mark computer-mark"></span>
            <span>컴퓨터</span>
          </button>
          <button class="dock-button" data-view="badges" type="button" aria-label="배지">
            <span class="dock-mark badge-mark"></span>
            <span>배지</span>
          </button>
          <button class="dock-button" data-view="map" type="button" aria-label="학습맵">
            <span class="dock-mark map-mark"></span>
            <span>학습맵</span>
          </button>
          <button class="dock-button" data-view="teacher" type="button" aria-label="교사용 보기">
            <span class="dock-mark teacher-mark"></span>
            <span>교사</span>
          </button>
        </nav>

        <main class="main-workspace">
          <section id="mapView" class="view-panel" aria-labelledby="mapTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">대영역별 체험 모듈</p>
                <h2 id="mapTitle">전체 플랫폼</h2>
              </div>
              <div class="legend" aria-label="타일 상태">
                <span><i class="legend-dot open"></i>체험</span>
                <span><i class="legend-dot done"></i>완료</span>
                <span><i class="legend-dot preview"></i>자리</span>
              </div>
            </div>

            <div class="map-layout">
              <div class="module-map-wrap" aria-label="대영역별 체험 모듈">
                <div id="moduleMap" class="module-map"></div>
              </div>

              <aside id="moduleDetail" class="module-detail" aria-live="polite"></aside>
            </div>
          </section>

          <section id="computerView" class="view-panel virtual-panel active" aria-labelledby="computerTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">디지터시 컴퓨터</p>
                <h2 id="computerTitle">바탕화면</h2>
              </div>
            </div>
            <div id="virtualDesktop" class="desktop-preview" aria-label="디지터시 가상 바탕화면"></div>
          </section>

          <section id="badgesView" class="view-panel" aria-labelledby="badgesTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">수집함</p>
                <h2 id="badgesTitle">배지 보드</h2>
              </div>
            </div>
            <div id="badgeBoard" class="badge-board"></div>
          </section>

          <section id="teacherView" class="view-panel" aria-labelledby="teacherTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">간이 교사용 보기</p>
                <h2 id="teacherTitle">진행 현황</h2>
              </div>
            </div>
            <div id="teacherBoard" class="teacher-board"></div>
          </section>
        </main>
      </div>
    </div>

    <div id="missionOverlay" class="mission-overlay" aria-hidden="true">
      <div class="mission-shell">
        <header class="mission-topbar">
          <button id="backToMapButton" class="control-button" type="button" aria-label="모듈 맵으로 돌아가기">
            <span aria-hidden="true">←</span>
            <span>컴퓨터</span>
          </button>
          <div class="mission-title-block">
            <span id="missionAreaLabel" class="mission-kicker">ICT</span>
            <h2 id="missionTitle">미션</h2>
          </div>
          <div class="mission-progress">
            <span id="missionStepLabel">1 / 1</span>
            <div class="progress-track">
              <div id="missionProgressFill" class="progress-fill"></div>
            </div>
          </div>
        </header>

        <div class="mission-body">
          <aside class="guide-console">
            <img src="assets/digiteracy-mascot.svg" alt="" class="guide-mascot" />
            <div>
              <p id="guideTitle" class="guide-title">준비</p>
              <p id="guideText" class="guide-text">시작해 볼까요?</p>
            </div>
            <button id="demoButton" class="demo-button" type="button">따라하기</button>
          </aside>

          <section id="missionDesktop" class="mission-desktop" aria-live="polite"></section>
        </div>
      </div>
    </div>

    <script type="module" src="app.js?v=20260603-os5"></script>
  </body>
</html>

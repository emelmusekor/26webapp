<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 판사 - 초등학생을 위한 AI 윤리 체험</title>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .slide-in { animation: slideIn 0.3s ease-out; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- 데이터 세트 ---
    const CATEGORIES = {
      ITEM: { id: 'ITEM', name: '물건 문제', icon: 'fa-box', color: 'bg-orange-100 text-orange-600' },
      PHYSICAL: { id: 'PHYSICAL', name: '신체 장난', icon: 'fa-person-running', color: 'bg-red-100 text-red-600' },
      WORDS: { id: 'WORDS', name: '말과 관계', icon: 'fa-comment-dots', color: 'bg-pink-100 text-pink-600' },
      DIGITAL: { id: 'DIGITAL', name: '디지털·AI 윤리', icon: 'fa-mobile-screen', color: 'bg-purple-100 text-purple-600' },
      COMMUNITY: { id: 'COMMUNITY', name: '공동체 규칙', icon: 'fa-users', color: 'bg-green-100 text-green-600' },
    };

    const JUDGEMENT_LEVELS = ['책임 없음', '가벼운 책임', '분명한 책임', '큰 책임', '공동체 회복 필요'];

    const CRITERIA = [
      { id: '의도성', title: '일부러 그랬을까?', desc: '실수였는지, 아니면 일부러 한 행동인지 살펴봐요.' },
      { id: '예측 가능성', title: '미리 알 수 있었을까?', desc: '이런 문제가 생길 것을 미리 예상할 수 있었는지 확인해요.' },
      { id: '피해의 정도', title: '얼마나 아팠을까?', desc: '다치거나 마음이 상한 정도, 물건이 망가진 정도를 봐요.' },
      { id: '행동의 위험성', title: '얼마나 위험한 행동인가?', desc: '자칫하면 더 큰 사고로 이어질 수 있었던 행동인지 살펴봐요.' },
      { id: '반복성', title: '처음 있는 일일까?', desc: '이전에도 비슷한 잘못을 반복했는지 확인해요.' },
      { id: '사과와 회복 노력', title: '사과하고 노력했나?', desc: '자신의 잘못을 인정하고 사과하며 고치려고 노력했는지 봐요.' },
      { id: '피해자의 입장', title: '피해자는 어떤 마음일까?', desc: '상처받은 친구의 마음이 어떨지, 무엇을 원하는지 가장 중요하게 생각해요.' },
      { id: '공동체 영향', title: '우리 반에 어떤 영향을 줄까?', desc: '이 일로 인해 우리 반 전체의 분위기나 규칙이 어떻게 될지 살펴봐요.' }
    ];

    const CASES = [
      {
        id: 1, category: CATEGORIES.ITEM, title: '친구 안경 밟기', difficulty: '쉬움',
        story: '체육 시간에 지훈이가 안경을 벗어두고 피구를 하러 갔습니다. 민수가 뒤로 물러서다가 바닥에 있던 지훈이의 안경을 실수로 밟아서 안경테가 부러졌습니다. 민수는 너무 놀라서 미안하다고 사과했습니다.',
        aiJudgement: {
          level: '가벼운 책임',
          scores: { intent: 1, predictable: 4, damage: 3 },
          reason: '일부러 밟은 것은 아니지만, 바닥에 물건이 있는지 조심해서 살펴야 했어요.',
          recovery: '진심으로 다시 한번 사과하고, 부모님께 말씀드려 안경 수리 방법을 함께 의논해야 해요.',
          whatIf: '만약 민수가 안경을 보고도 장난치려고 일부러 밟았다면 어떻게 될까요? "의도성"이 높아져서 "큰 책임"으로 판결이 바뀌었을 거예요.',
        }
      },
      {
        id: 2, category: CATEGORIES.ITEM, title: '빌린 책에 낙서하기', difficulty: '보통',
        story: '수진이는 예은이에게 만화책을 빌렸습니다. 책을 읽다가 재미있는 장면이 나와서 자신도 모르게 볼펜으로 캐릭터 얼굴에 콧수염을 그렸습니다. 나중에 돌려줄 때 예은이가 보고 속상해했습니다.',
        aiJudgement: {
          level: '분명한 책임',
          scores: { intent: 4, predictable: 5, damage: 2 },
          reason: '자신의 책이 아닌데도 함부로 낙서를 했어요. 빌려준 친구의 마음을 상하게 한 책임이 있습니다.',
          recovery: '새 책으로 사주거나, 예은이가 원하는 방법으로 보상하고 빌린 물건을 소중히 다루겠다고 약속해요.',
          whatIf: '만약 연필로 살짝 그려서 지우개로 깨끗하게 지울 수 있는 상황이었다면 "피해 정도"가 낮아져 "가벼운 책임"이 되었을 수도 있어요.'
        }
      },
      {
        id: 3, category: CATEGORIES.PHYSICAL, title: '복도에서 뛰다가 쿵!', difficulty: '보통',
        story: '쉬는 시간, 준호가 화장실에 빨리 가려고 복도를 뛰어가다가 모퉁이를 돌던 1학년 동생과 강하게 부딪혔습니다. 동생은 넘어지면서 무릎이 까져 피가 났고 울음을 터뜨렸습니다.',
        aiJudgement: {
          level: '분명한 책임',
          scores: { intent: 1, predictable: 5, damage: 3 },
          reason: '복도에서 뛰면 누군가와 부딪힐 수 있다는 것을 충분히 알 수 있었고, 다치는 피해가 발생했어요.',
          recovery: '동생을 보건실로 데려가 치료를 돕고 사과해야 합니다. 복도에서 걷기 규칙을 스스로 점검해보세요.',
          whatIf: '동생이 다치지 않았더라도 "복도에서 뛰는 행동" 자체가 매우 위험하므로 여전히 책임을 물었을 거예요.'
        }
      },
      {
        id: 4, category: CATEGORIES.PHYSICAL, title: '위험한 의자 빼기 장난', difficulty: '어려움',
        story: '도윤이는 친구가 자리에 앉으려는 순간 장난으로 의자를 살짝 뺐습니다. 친구는 바닥에 엉덩방아를 크게 찧었고, 허리가 아파서 며칠 동안 병원에 다녀야 했습니다.',
        aiJudgement: {
          level: '큰 책임',
          scores: { intent: 5, predictable: 5, damage: 5 },
          reason: '크게 다칠 수 있는 매우 위험한 행동을 일부러 했어요. 장난이라도 결과가 심각하므로 큰 책임이 있습니다.',
          recovery: '친구와 부모님께 진심으로 사과하고, 친구의 학교생활을 도와주며 회복을 위해 최선을 다해야 합니다.',
          whatIf: '친구가 우연히 다치지 않고 중심을 잡았더라도, 자칫 큰 사고로 이어질 수 있는 "행동의 위험성" 때문에 여전히 무거운 책임이 따릅니다.'
        }
      },
      {
        id: 5, category: CATEGORIES.WORDS, title: '싫어하는 별명 부르기', difficulty: '보통',
        story: '승민이는 은지가 화내는 모습이 재미있어서, 은지가 싫어하는 별명인 "뚱이"라고 계속 불렀습니다. 은지가 하지 말라고 여러 번 말했지만, 승민이는 "장난인데 왜 그래?"라며 멈추지 않았습니다.',
        aiJudgement: {
          level: '분명한 책임',
          scores: { intent: 5, predictable: 5, damage: 3 },
          reason: '상대방이 싫다고 표현했는데도 반복해서 부른 것은 장난이 아니라 괴롭힘이에요.',
          recovery: '은지에게 진심이 담긴 사과 편지를 쓰고, 앞으로는 은지가 좋아하는 이름으로만 부르기로 약속해요.',
          whatIf: '은지가 "하지마"라고 말했을 때 승민이가 즉시 멈추고 사과했다면(반복성 없음), 훨씬 가벼운 책임으로 끝났을 거예요.'
        }
      },
      {
        id: 7, category: CATEGORIES.DIGITAL, title: '단톡방 무시하기', difficulty: '어려움',
        story: '반 친구들 5명이 있는 단톡방에 재민이가 들어왔습니다. 재민이가 인사를 하고 질문을 했지만, 나머지 4명의 친구들은 미리 약속한 것처럼 대답 없이 자기들끼리만 이야기했습니다.',
        aiJudgement: {
          level: '공동체 회복 필요',
          scores: { intent: 5, predictable: 5, damage: 4 },
          reason: '여럿이 모여 한 사람을 일부러 소외시키는 사이버 따돌림이며, 마음에 큰 상처를 줍니다.',
          recovery: '4명의 친구들은 재민이에게 사과하고, 반 전체가 사이버 따돌림 예방 교육을 받으며 규칙을 만들어야 해요.',
          whatIf: '친구들이 정말로 바빠서 메시지를 늦게 봤다면 의도성이 없겠지만, "미리 약속한 것처럼" 일부러 한 행동이므로 책임이 큽니다.'
        }
      },
      {
        id: 8, category: CATEGORIES.DIGITAL, title: 'AI로 친구 사진 합성', difficulty: '어려움',
        story: '우진이는 AI 앱으로 민재의 얼굴을 우스꽝스러운 원숭이에 합성하여 단톡방에 올려 친구들이 웃도록 만들었습니다. 민재는 매우 창피했습니다.',
        aiJudgement: {
          level: '큰 책임',
          scores: { intent: 5, predictable: 5, damage: 4 },
          reason: '허락 없이 타인의 얼굴을 사용하고, AI로 조작해 망신을 준 것은 심각한 사이버 폭력입니다.',
          recovery: '사진을 즉시 삭제하고 공개 사과문을 올려야 해요. 디지털 윤리 교육을 받아야 합니다.',
          whatIf: '만약 민재에게 미리 허락을 받고, 민재도 같이 즐거워할 만한 귀여운 합성(예: 우주비행사)이었다면 문제가 되지 않았을 거예요.'
        }
      },
      {
        id: 9, category: CATEGORIES.COMMUNITY, title: '급식 새치기', difficulty: '쉬움',
        story: '태현이는 돈까스를 빨리 먹고 싶은 마음에 줄을 서 있는 친구를 밀치고 맨 앞으로 가서 섰습니다. 뒤에 서 있던 친구들이 불만을 터뜨렸습니다.',
        aiJudgement: {
          level: '가벼운 책임',
          scores: { intent: 5, predictable: 4, damage: 2 },
          reason: '자신의 욕심을 위해 반 전체가 지키는 질서를 깼어요.',
          recovery: '친구들에게 사과하고, 일주일간 제일 마지막에 줄을 서며 질서를 지키는 연습을 해요.',
          whatIf: '친구가 밀쳐져서 넘어지거나 다쳤다면 단순한 질서 위반을 넘어 "신체 피해"에 대한 큰 책임을 지게 됩니다.'
        }
      },
      {
        id: 19, category: CATEGORIES.DIGITAL, title: 'AI 숙제 베끼기', difficulty: '보통',
        story: '성민이는 책을 읽기 귀찮아서 대화형 AI에게 독후감을 써달라고 한 뒤, 그대로 자신의 이름으로 제출했습니다.',
        aiJudgement: {
          level: '분명한 책임',
          scores: { intent: 5, predictable: 5, damage: 2 },
          reason: '자신의 노력이 아닌 AI의 결과물을 자신의 것처럼 속인 정직하지 못한 행동입니다.',
          recovery: '선생님께 사실대로 말씀드리고 사과한 뒤, 책을 직접 읽고 스스로의 생각으로 다시 써서 제출해야 합니다.',
          whatIf: '성민이가 직접 글을 쓰고, 문법 검사나 더 좋은 단어 추천을 위해 AI를 참고자료로만 활용했다면 올바른 AI 사용이었을 거예요.'
        }
      }
    ];

    // --- 별점 컴포넌트 ---
    const StarRating = ({ score, colorClass = "text-amber-500", onChange = null }) => {
      return (
        <div className="flex justify-center gap-1">
          {[1, 2, 3, 4, 5].map((i) => (
            <button 
              key={i} 
              type="button"
              disabled={!onChange}
              onClick={() => onChange && onChange(i)}
              className={`text-2xl transition-transform ${onChange ? 'hover:scale-125 cursor-pointer' : 'cursor-default'} ${i <= score ? colorClass : 'text-slate-200'}`}
            >
              <i className="fa-solid fa-star"></i>
            </button>
          ))}
        </div>
      );
    };

    // --- 컴포넌트 ---

    // 1. 시작 화면
    const StartScreen = ({ onStart, onViewCriteria }) => (
      <div className="flex flex-col items-center justify-center min-h-[80vh] text-center p-6 fade-in">
        <div className="w-24 h-24 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-6 shadow-md text-4xl">
          <i className="fa-solid fa-scale-balanced"></i>
        </div>
        <h1 className="text-4xl md:text-5xl font-extrabold text-slate-800 mb-4">
          AI 판사
        </h1>
        <p className="text-lg md:text-xl text-slate-600 max-w-md mb-10 leading-relaxed">
          학교생활 속 사건을 보고, 내가 먼저 판결해 보세요. <br />
          그다음 AI 판사의 판단과 비교하며 <span className="font-bold text-blue-600">공정한 판단 기준</span>을 배워 봅니다.
        </p>
        <div className="flex flex-col sm:flex-row gap-4 w-full justify-center">
          <button onClick={onStart} className="px-8 py-4 bg-blue-600 text-white rounded-2xl font-bold text-lg shadow-lg hover:bg-blue-700 hover:-translate-y-1 transition-all flex items-center justify-center">
            <i className="fa-solid fa-book-open mr-2"></i> 사건 시작하기
          </button>
          <button onClick={onViewCriteria} className="px-8 py-4 bg-white text-blue-600 border-2 border-blue-100 rounded-2xl font-bold text-lg shadow-sm hover:bg-blue-50 transition-all flex items-center justify-center">
            <i className="fa-solid fa-circle-exclamation mr-2"></i> 판단 기준 보기
          </button>
        </div>
      </div>
    );

    // 2. 판단 기준 화면
    const CriteriaScreen = ({ onBack }) => (
      <div className="max-w-4xl mx-auto p-4 md:p-6 slide-in">
        <div className="flex items-center mb-8">
          <button onClick={onBack} className="p-2 mr-4 bg-slate-100 hover:bg-slate-200 rounded-full transition-colors w-10 h-10 flex items-center justify-center">
            <i className="fa-solid fa-arrow-left text-slate-700"></i>
          </button>
          <h2 className="text-3xl font-bold text-slate-800 flex items-center">
            <i className="fa-solid fa-scale-balanced mr-3 text-blue-500"></i> AI 판사의 판단 기준
          </h2>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
          {CRITERIA.map((criteria, index) => (
            <div key={index} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow">
              <div className="inline-block px-3 py-1 bg-blue-50 text-blue-700 text-xs font-bold rounded-full mb-3">
                기준 {index + 1}
              </div>
              <h3 className="text-lg font-bold text-slate-800 mb-2">{criteria.title}</h3>
              <p className="text-slate-600 text-sm leading-relaxed">{criteria.desc}</p>
            </div>
          ))}
        </div>
      </div>
    );

    // 3. 사건 선택 화면
    const CaseListScreen = ({ onSelectCase }) => {
      const [filter, setFilter] = useState('ALL');
      const filteredCases = filter === 'ALL' ? CASES : CASES.filter(c => c.category.id === filter);

      return (
        <div className="max-w-5xl mx-auto p-4 md:p-6 fade-in">
          <h2 className="text-3xl font-bold text-slate-800 mb-6 text-center">어떤 사건을 판결할까요?</h2>
          <div className="flex flex-wrap justify-center gap-2 mb-8">
            <button onClick={() => setFilter('ALL')} className={`px-4 py-2 rounded-full text-sm font-bold transition-colors ${filter === 'ALL' ? 'bg-slate-800 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
              전체 보기
            </button>
            {Object.values(CATEGORIES).map(cat => (
              <button key={cat.id} onClick={() => setFilter(cat.id)} className={`flex items-center px-4 py-2 rounded-full text-sm font-bold transition-colors ${filter === cat.id ? cat.color : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                <i className={`fa-solid ${cat.icon} mr-2`}></i> {cat.name}
              </button>
            ))}
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            {filteredCases.map(caseItem => (
              <button key={caseItem.id} onClick={() => onSelectCase(caseItem)} className="text-left bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-lg hover:-translate-y-1 transition-all flex flex-col h-full group">
                <div className={`inline-flex items-center px-3 py-1 rounded-full text-xs font-bold mb-4 ${caseItem.category.color}`}>
                  <i className={`fa-solid ${caseItem.category.icon} mr-1`}></i> {caseItem.category.name}
                </div>
                <h3 className="text-xl font-bold text-slate-800 mb-2 group-hover:text-blue-600 transition-colors">
                  {caseItem.title}
                </h3>
                <p className="text-slate-500 text-sm line-clamp-3 mb-4 flex-grow leading-relaxed">
                  {caseItem.story}
                </p>
                <div className="flex justify-between items-center w-full pt-4 border-t border-slate-50">
                  <span className="text-xs text-slate-400 font-medium">난이도: {caseItem.difficulty}</span>
                  <span className="text-blue-500 flex items-center text-sm font-bold group-hover:translate-x-1 transition-transform">
                    판결하기 <i className="fa-solid fa-chevron-right ml-1 text-xs"></i>
                  </span>
                </div>
              </button>
            ))}
          </div>
        </div>
      );
    };

    // 4. 사건 읽기 화면
    const CaseReadScreen = ({ caseItem, onProceed, onBack }) => (
      <div className="max-w-2xl mx-auto p-4 md:p-6 slide-in">
        <button onClick={onBack} className="flex items-center text-slate-500 hover:text-slate-800 mb-6 font-medium transition-colors">
          <i className="fa-solid fa-arrow-left mr-2"></i> 다른 사건 고르기
        </button>
        <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
          <div className={`${caseItem.category.color.replace('text-', 'bg-opacity-20 text-')} p-6 border-b border-white/20`}>
            <div className="flex items-center gap-2 mb-2 opacity-80">
              <i className={`fa-solid ${caseItem.category.icon} text-sm`}></i>
              <span className="font-bold text-sm">{caseItem.category.name}</span>
            </div>
            <h2 className="text-2xl md:text-3xl font-extrabold text-slate-900">{caseItem.title}</h2>
          </div>
          <div className="p-6 md:p-8">
            <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center">
              <i className="fa-solid fa-book-open mr-2 text-blue-500"></i> 사건 내용
            </h3>
            <p className="text-lg text-slate-700 leading-loose bg-slate-50 p-6 rounded-2xl border border-slate-100">
              {caseItem.story}
            </p>
            <button onClick={onProceed} className="mt-8 w-full py-4 bg-blue-600 text-white rounded-2xl font-bold text-lg shadow-md hover:bg-blue-700 transition-colors">
              내가 판사 되어보기
            </button>
          </div>
        </div>
      </div>
    );

    // 5. 학생 판결 화면 (질문 6 추가)
    const StudentJudgeScreen = ({ caseItem, onSubmit, onBack }) => {
      const [answers, setAnswers] = useState({
        intent: 0,
        predictable: 0,
        damage: 0,
        level: '',
        recovery: '',
        reasoning: '' // 질문 6 추가
      });

      const isComplete = 
        answers.intent > 0 && 
        answers.predictable > 0 && 
        answers.damage > 0 && 
        answers.level !== '' && 
        answers.recovery.trim() !== '' &&
        answers.reasoning.trim() !== '';

      const handleChange = (key, value) => {
        setAnswers(prev => ({ ...prev, [key]: value }));
      };

      return (
        <div className="max-w-3xl mx-auto p-4 md:p-6 pb-20 slide-in">
          <div className="flex items-center justify-between mb-6">
            <button onClick={onBack} className="text-slate-500 hover:text-slate-800 font-medium flex items-center">
              <i className="fa-solid fa-arrow-left mr-2"></i> 다시 읽기
            </button>
            <span className="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-bold">나의 판결 과정</span>
          </div>

          <h2 className="text-2xl font-bold text-slate-800 mb-6">질문에 답하며 공정한 판결을 내려봐요.</h2>

          <div className="space-y-6">
            {/* 1, 2, 3 점수화 */}
            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center">
              <label className="block text-lg font-bold text-slate-800 mb-2">1. 얼마나 일부러 한 행동인가요? (의도성)</label>
              <StarRating score={answers.intent} onChange={(val) => handleChange('intent', val)} />
            </div>

            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center">
              <label className="block text-lg font-bold text-slate-800 mb-2">2. 피해를 미리 알 수 있었을까요? (예측 가능성)</label>
              <StarRating score={answers.predictable} onChange={(val) => handleChange('predictable', val)} colorClass="text-purple-500" />
            </div>

            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center">
              <label className="block text-lg font-bold text-slate-800 mb-2">3. 피해의 정도는 어느 정도인가요? (피해 정도)</label>
              <StarRating score={answers.damage} onChange={(val) => handleChange('damage', val)} colorClass="text-red-500" />
            </div>

            {/* 4. 판결 수준 */}
            <div className="bg-amber-50 p-6 rounded-2xl border border-amber-100">
              <label className="block text-lg font-bold text-amber-900 mb-3 flex items-center">
                <i className="fa-solid fa-scale-balanced mr-2"></i> 4. 어떤 판결이 적절할까요?
              </label>
              <div className="flex flex-wrap gap-2">
                {JUDGEMENT_LEVELS.map(level => (
                  <button key={level} onClick={() => handleChange('level', level)}
                    className={`px-5 py-3 rounded-xl font-bold transition-all ${answers.level === level ? 'bg-amber-500 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-amber-100'}`}>
                    {level}
                  </button>
                ))}
              </div>
            </div>

            {/* 5. 회복 방법 */}
            <div className="bg-green-50 p-6 rounded-2xl border border-green-100">
              <label className="block text-lg font-bold text-green-900 mb-3 flex items-center">
                <i className="fa-solid fa-handshake-angle mr-2"></i> 5. 어떤 회복 방법이 필요할까요?
              </label>
              <textarea value={answers.recovery} onChange={(e) => handleChange('recovery', e.target.value)}
                placeholder="예: 진심으로 사과하고 망가진 물건을 고쳐준다."
                className="w-full p-4 rounded-xl border-none ring-1 ring-green-200 focus:ring-2 focus:ring-green-500 bg-white resize-none text-slate-700 h-24"
              />
            </div>

            {/* 6. 생각의 이유 (추가된 부분) */}
            <div className="bg-blue-50 p-6 rounded-2xl border border-blue-100">
              <label className="block text-lg font-bold text-blue-900 mb-3 flex items-center">
                <i className="fa-solid fa-pen-to-square mr-2"></i> 6. 왜 이렇게 생각했나요?
              </label>
              <textarea value={answers.reasoning} onChange={(e) => handleChange('reasoning', e.target.value)}
                placeholder="판결을 내린 이유나 기준을 자유롭게 적어보세요. (예: 고의는 아니지만 조심성이 부족했기 때문입니다.)"
                className="w-full p-4 rounded-xl border-none ring-1 ring-blue-200 focus:ring-2 focus:ring-blue-500 bg-white resize-none text-slate-700 h-28"
              />
            </div>
          </div>

          <button onClick={() => onSubmit(answers)} disabled={!isComplete}
            className={`mt-8 w-full py-4 rounded-2xl font-bold text-lg shadow-md transition-all flex justify-center items-center ${isComplete ? 'bg-blue-600 text-white hover:bg-blue-700 hover:-translate-y-1' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
            <i className="fa-solid fa-gavel mr-2 text-xl"></i> {isComplete ? '판결 결과 보기' : '모든 질문에 답하면 결과를 볼 수 있어요'}
          </button>
        </div>
      );
    };

    // 6. AI 판사 결과 화면
    const ResultScreen = ({ caseItem, studentAnswers, onReset }) => {
      const CompareRow = ({ title, stScore, aiScore, colorClass }) => (
        <div className="mb-4">
          <div className="text-sm font-bold text-slate-600 mb-1">{title}</div>
          <div className="flex items-center justify-between bg-white rounded-lg p-2 border border-slate-100 shadow-sm">
            <div className="w-1/3 flex flex-col items-center border-r border-slate-100">
              <span className="text-[10px] text-slate-400 font-bold mb-1">나의 점수</span>
              <StarRating score={stScore} colorClass={colorClass} />
            </div>
            <div className="w-1/3 flex justify-center items-center font-black text-slate-200 text-lg">VS</div>
            <div className="w-1/3 flex flex-col items-center border-l border-slate-100">
              <span className="text-[10px] text-blue-400 font-bold mb-1">AI의 점수</span>
              <StarRating score={aiScore} colorClass="text-blue-500" />
            </div>
          </div>
        </div>
      );

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-6 pb-20 slide-in">
          <h2 className="text-3xl font-extrabold text-slate-800 mb-8 text-center">나의 판단 vs AI 판단</h2>

          {/* 비교표 섹션 */}
          <div className="bg-slate-50 p-6 rounded-3xl border-2 border-slate-200 mb-8">
            <h3 className="text-xl font-bold text-slate-800 mb-6 text-center border-b border-slate-200 pb-4">
              <i className="fa-solid fa-chart-bar mr-2 text-slate-400"></i> 점수 비교
            </h3>
            <div className="max-w-2xl mx-auto">
              <CompareRow title="의도성" stScore={studentAnswers.intent} aiScore={caseItem.aiJudgement.scores.intent} colorClass="text-amber-500" />
              <CompareRow title="예측 가능성" stScore={studentAnswers.predictable} aiScore={caseItem.aiJudgement.scores.predictable} colorClass="text-purple-500" />
              <CompareRow title="피해 정도" stScore={studentAnswers.damage} aiScore={caseItem.aiJudgement.scores.damage} colorClass="text-red-500" />
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            {/* 학생 판단 이유 비교 */}
            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
              <div className="flex items-center gap-2 mb-4">
                <div className="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-500">
                  <i className="fa-solid fa-user"></i>
                </div>
                <h3 className="text-lg font-bold text-slate-700">나의 판결 근거</h3>
              </div>
              <div className="bg-slate-50 p-4 rounded-xl min-h-[100px] border border-slate-100 italic text-slate-600">
                "{studentAnswers.reasoning}"
              </div>
              <div className="mt-4 pt-4 border-t border-slate-100">
                <span className="text-xs font-bold text-slate-400 block mb-1">나의 판결 수준</span>
                <span className="font-bold text-slate-800">{studentAnswers.level}</span>
              </div>
            </div>

            {/* AI 판단 이유 비교 */}
            <div className="bg-blue-50 p-6 rounded-3xl border border-blue-200 shadow-md">
              <div className="flex items-center gap-2 mb-4">
                <div className="w-8 h-8 bg-blue-500 rounded-full flex items-center justify-center text-white">
                  <i className="fa-solid fa-robot"></i>
                </div>
                <h3 className="text-lg font-bold text-blue-700">AI의 판결 근거</h3>
              </div>
              <div className="bg-white/80 p-4 rounded-xl min-h-[100px] border border-blue-100 text-blue-900 leading-relaxed">
                {caseItem.aiJudgement.reason}
              </div>
              <div className="mt-4 pt-4 border-t border-blue-100">
                <span className="text-xs font-bold text-blue-400 block mb-1">AI의 판결 수준</span>
                <span className="font-bold text-blue-800">{caseItem.aiJudgement.level}</span>
              </div>
            </div>
          </div>

          {/* 회복과 다른 판결 (What If) */}
          <div className="bg-white rounded-3xl shadow-md border border-slate-100 overflow-hidden mb-8">
            <div className="bg-green-50 p-6 border-b border-green-100">
              <h3 className="text-lg font-bold text-green-800 mb-2 flex items-center">
                <i className="fa-solid fa-handshake-angle mr-2"></i> 회복 제안 비교
              </h3>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <span className="text-[10px] font-bold text-green-600 block mb-1">나의 제안</span>
                  <p className="text-xs text-slate-700">{studentAnswers.recovery}</p>
                </div>
                <div>
                  <span className="text-[10px] font-bold text-green-600 block mb-1">AI의 제안</span>
                  <p className="text-xs text-slate-700">{caseItem.aiJudgement.recovery}</p>
                </div>
              </div>
            </div>
            <div className="bg-purple-50 p-6">
              <h3 className="text-lg font-bold text-purple-800 mb-2 flex items-center">
                <i className="fa-solid fa-shuffle mr-2"></i> 상황이 달라진다면?
              </h3>
              <p className="text-purple-900 leading-relaxed text-sm">
                {caseItem.aiJudgement.whatIf}
              </p>
            </div>
          </div>

          {/* AI 한계 고지 및 윤리 질문 */}
          <div className="bg-slate-800 text-white p-6 md:p-8 rounded-3xl shadow-lg mb-8">
            <h3 className="text-xl font-bold flex items-center mb-3 text-amber-400">
              <i className="fa-solid fa-triangle-exclamation mr-2"></i> AI의 판단은 정답이 아니에요!
            </h3>
            <p className="text-slate-300 text-sm mb-6 leading-relaxed bg-slate-700/50 p-4 rounded-xl">
              AI는 사건 데이터만으로 계산할 뿐, 여러분이 느끼는 미묘한 감정이나 상황을 100% 알지 못해요. 
              <strong> 실제 판결보다는 '판단 기준'을 배우는 데 집중해 보세요.</strong>
            </p>

            <h4 className="font-bold text-lg text-blue-300 mb-4 flex items-center">
              <i className="fa-regular fa-lightbulb mr-2"></i> AI 윤리 연결 질문
            </h4>
            <ul className="space-y-4 text-sm text-slate-200">
              <li className="flex items-start"><span className="text-blue-400 mr-2">Q1.</span> AI가 친구의 마음을 완전히 알 수 있을까요?</li>
              <li className="flex items-start"><span className="text-blue-400 mr-2">Q2.</span> AI가 놓칠 수 있는 중요한 정보는 무엇일까요?</li>
              <li className="flex items-start"><span className="text-blue-400 mr-2">Q3.</span> 공정한 판단을 위해 사람은 어떤 역할을 해야 할까요?</li>
            </ul>
          </div>

          <div className="flex justify-center">
            <button onClick={onReset} className="px-8 py-4 bg-blue-600 text-white rounded-2xl font-bold text-lg shadow-md hover:bg-blue-700 hover:-translate-y-1 transition-all flex items-center">
              <i className="fa-solid fa-house mr-2"></i> 다른 사건 고르기
            </button>
          </div>
        </div>
      );
    };

    // --- 메인 App 컴포넌트 ---
    const App = () => {
      const [currentView, setCurrentView] = useState('home');
      const [selectedCase, setSelectedCase] = useState(null);
      const [studentAnswers, setStudentAnswers] = useState(null);

      const NavBar = () => (
        <div className="bg-white p-4 shadow-sm flex items-center justify-between sticky top-0 z-10 border-b border-slate-100">
          <div className="flex items-center font-black text-xl text-blue-600 cursor-pointer" onClick={() => setCurrentView('home')}>
            <i className="fa-solid fa-scale-balanced mr-2"></i> AI 판사
          </div>
          {currentView !== 'home' && (
            <button onClick={() => setCurrentView('home')} className="p-2 bg-slate-100 text-slate-600 rounded-full hover:bg-slate-200 transition-colors w-10 h-10 flex items-center justify-center">
              <i className="fa-solid fa-house"></i>
            </button>
          )}
        </div>
      );

      return (
        <div className="min-h-screen bg-slate-50 font-sans">
          <NavBar />
          <main className="container mx-auto mt-4">
            {currentView === 'home' && <StartScreen onStart={() => setCurrentView('cases')} onViewCriteria={() => setCurrentView('criteria')} />}
            {currentView === 'criteria' && <CriteriaScreen onBack={() => setCurrentView('home')} />}
            {currentView === 'cases' && <CaseListScreen onSelectCase={(c) => { setSelectedCase(c); setCurrentView('read'); }} />}
            {currentView === 'read' && selectedCase && <CaseReadScreen caseItem={selectedCase} onProceed={() => setCurrentView('judge')} onBack={() => setCurrentView('cases')} />}
            {currentView === 'judge' && selectedCase && <StudentJudgeScreen caseItem={selectedCase} onSubmit={(ans) => { setStudentAnswers(ans); setCurrentView('result'); }} onBack={() => setCurrentView('read')} />}
            {currentView === 'result' && selectedCase && studentAnswers && <ResultScreen caseItem={selectedCase} studentAnswers={studentAnswers} onReset={() => { setSelectedCase(null); setStudentAnswers(null); setCurrentView('cases'); }} />}
          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
